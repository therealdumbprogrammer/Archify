name: two-service-rest
description: Two Spring Boot REST services communicating via Feign
diagram:
  nodes:
    - id: serviceA
      label: serviceAName
    - id: serviceB
      label: serviceBName
  edges:
    - source: serviceA
      target: serviceB
      label: REST
inputs:
  - name: serviceAName
    type: string
    required: true
  - name: serviceBName
    type: string
    required: true
  - name: entities
    type: entityList
    required: true
  - name: communication
    type: communication
    required: true
  - name: database
    type: databaseType
    required: true
